[project]
name = "nora-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "temporalio",
    "pm4py",
    "jsonschema",
    "pyarrow>=26.0.0",
    "duckdb>=1.5.6",
    "boto3>=1.43.114",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
